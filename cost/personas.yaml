    input: 0.10
    output: 0.50
    source: "(tự ước tính) Kịch bản giá theo mức người phụ trách cung cấp ngày 28/11/2026; CHƯA xác minh giá thanh toán của endpoint 9router. Không phải bảng giá đã xác nhận. Không tính cache hay credit subscription."
  - model: gpt-4o-mini
    input: 0.15
    output: 0.60
