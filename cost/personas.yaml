# CP4 — Đinh Thị Hường; số tần suất lấy từ khảo sát, còn quy mô và lượt hỏi/phiên là tự ước tính.
sessions: 50
seed: 42

users:
  low: 100
  base: 1000
  high: 10000
  source: "(tự ước tính) 3 quy mô triển khai thử 100/1000/10000 người; không phải số người dùng đã có hoặc ước lượng thị trường."

personas:
  - name: xem_it
    share: 0.461538461538462
    uses_per_month: 0.833333333333333
    turns_per_session: 1
    source: "evidence/survey/results.csv: nhóm chính n=13; 6 phiếu (4,15,16,17,18,21), tần suất [0, 1, 1, 1, 1, 1]; share và uses_per_month tính từ CSV; turns_per_session=1 (tự ước tính), khảo sát không đo số lượt hỏi chatbot."
  - name: xem_vua
    share: 0.307692307692308
    uses_per_month: 2.250000000000000
    turns_per_session: 2
    source: "evidence/survey/results.csv: nhóm chính n=13; 4 phiếu (11,12,13,22), tần suất [3, 2, 2, 2]; share và uses_per_month tính từ CSV; turns_per_session=2 (tự ước tính), khảo sát không đo số lượt hỏi chatbot."
  - name: xem_nhieu
    share: 0.230769230769231
    uses_per_month: 8.000000000000000
    turns_per_session: 3
    source: "evidence/survey/results.csv: nhóm chính n=13; 3 phiếu (9,14,19), tần suất [4, 10, 10]; share và uses_per_month tính từ CSV; turns_per_session=3 (tự ước tính), khảo sát không đo số lượt hỏi chatbot."

prices:
